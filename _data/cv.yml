    - title: Graduate Research Assistant - Echolab
      year: Aug 2023 – Present
      institution: Virginia Tech
      location: Blacksburg, VA, USA
      description:
        - Independently drive research from concept to publication, drawing on human–AI
          interaction, behavioral science, and NLP literature to develop human-in-the-loop
          agentic systems.
        - Collaborate with psychology and social science researchers to design AI agents
          that support executive functioning, planning, and self-reflection.
        - Design and conduct mixed-methods field studies that combine qualitative interviews
          with quantitative measures of user behavior and self-reported outcomes to evaluate
          systems and inform iterative design.
        - Analyze interviews and interaction data using thematic analysis and statistical
          methods in R, including regression, generalized linear mixed models (GLMMs)
          to translate findings into actionable design recommendations.
        - Present research findings to interdisciplinary audiences and write and prepare
          manuscripts for peer-reviewed publication.
